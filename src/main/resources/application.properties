spring.application.name=ecommerce
server.port=8082

spring.datasource.url=jdbc:postgresql://localhost:5433/ecommerce
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/ecommerce

app.images.upload-dir=${user.home}/ecommerce-data/uploads

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=105MB